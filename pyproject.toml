[project]
name = "quantbot"
version = "0.1.0"
description = "Gemini crypto quant trading system with an AI research layer (blue-chip only)"
requires-python = ">=3.9"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
