name: Gemini Public Init Test

on:
  push:
    branches:
      - main
      - gemini-test
  pull_request:
    branches:
      - main
      - gemini-test

jobs:
  run-gemini-public-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Gemini public-only test
        env:
          GEMINI_TEST_PUBLIC_ONLY: "1"
        run: |
          python experiments/gemini_doc_init_test.py

